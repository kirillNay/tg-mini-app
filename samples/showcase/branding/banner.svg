<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=block');
      text { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1621"/>
      <stop offset="1" stop-color="#17212B"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.12" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#2AABEE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2AABEE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.85" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#6A4DF4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6A4DF4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AABEE"/>
      <stop offset="1" stop-color="#6A4DF4"/>
    </linearGradient>
    <linearGradient id="brandText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC2FF"/>
      <stop offset="1" stop-color="#9B85FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F5CFF"/>
      <stop offset="0.55" stop-color="#E0457B"/>
      <stop offset="1" stop-color="#FF9A3C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screen"><rect x="840" y="96" width="344" height="700" rx="44"/></clipPath>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glowBlue)"/>
  <rect width="1280" height="720" fill="url(#glowViolet)"/>

  <!-- mark -->
  <g transform="translate(96 132)">
    <rect width="88" height="88" rx="24" fill="url(#brand)"/>
    <rect x="20" y="16" width="48" height="56" rx="12" fill="#FFFFFF"/>
    <rect x="26" y="34" width="17" height="14" rx="4" fill="url(#accent)"/>
    <rect x="45" y="34" width="17" height="14" rx="4" fill="#2AABEE"/>
    <rect x="26" y="51" width="17" height="12" rx="4" fill="#2AABEE" fill-opacity="0.25"/>
    <rect x="45" y="51" width="17" height="12" rx="4" fill="#6A4DF4" fill-opacity="0.25"/>
    <rect x="30" y="23" width="28" height="5" rx="2.5" fill="#DDE6F0"/>
  </g>

  <!-- title -->
  <text x="96" y="310" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">tg-mini-app</text>
  <text x="96" y="392" font-size="76" font-weight="800" fill="url(#brandText)" letter-spacing="-1.5">Showcase</text>
  <text x="96" y="452" font-size="27" font-weight="400" fill="#A9B8C8">Every Telegram Mini Apps capability,</text>
  <text x="96" y="490" font-size="27" font-weight="400" fill="#A9B8C8">built with Kotlin &amp; Compose Multiplatform</text>

  <!-- chips -->
  <g font-size="21" font-weight="500">
    <rect x="96" y="540" width="176" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="184" y="570" text-anchor="middle" fill="#E6EEF6">Bot API 10.1</text>
    <rect x="286" y="540" width="146" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="359" y="570" text-anchor="middle" fill="#E6EEF6">Kotlin/Wasm</text>
    <rect x="446" y="540" width="124" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="508" y="570" text-anchor="middle" fill="#E6EEF6">Kotlin/JS</text>
    <rect x="584" y="540" width="152" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="660" y="570" text-anchor="middle" fill="#E6EEF6">62 features</text>
  </g>

  <!-- phone -->
  <g filter="url(#shadow)">
    <rect x="824" y="80" width="376" height="740" rx="58" fill="#0A1018" stroke="#2A3746" stroke-width="2"/>
  </g>
  <g clip-path="url(#screen)">
    <rect x="840" y="96" width="344" height="700" fill="#232E3C"/>
    <!-- header -->
    <rect x="840" y="96" width="344" height="64" fill="#17212B"/>
    <path d="M872 120 l-10 10 l10 10" fill="none" stroke="#6AB3F3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="892" y="137" font-size="20" font-weight="700" fill="#F5F5F5">Showcase</text>
    <circle cx="1154" cy="128" r="4" fill="#708499"/><circle cx="1154" cy="116" r="4" fill="#708499"/><circle cx="1154" cy="140" r="4" fill="#708499"/>

    <!-- cards -->
    <g font-size="17">
      <rect x="856" y="178" width="312" height="92" rx="18" fill="#17212B"/>
      <rect x="872" y="196" width="36" height="36" rx="10" fill="url(#accent)"/>
      <text x="922" y="211" font-weight="700" fill="#F5F5F5">Buttons</text>
      <text x="922" y="236" font-size="14" fill="#708499">Main · Secondary · Back</text>
      <text x="1152" y="211" font-size="12" text-anchor="end" fill="#6AB3F3">Bot API 7.10+</text>
      <rect x="872" y="246" width="96" height="12" rx="6" fill="#5288C1" fill-opacity="0.9"/>

      <rect x="856" y="284" width="312" height="80" rx="18" fill="#17212B"/>
      <rect x="872" y="302" width="36" height="36" rx="10" fill="#2AABEE"/>
      <text x="922" y="317" font-weight="700" fill="#F5F5F5">Popups &amp; QR</text>
      <text x="922" y="342" font-size="14" fill="#708499">Alert · Confirm · Scanner</text>
      <text x="1152" y="317" font-size="12" text-anchor="end" fill="#6AB3F3">Bot API 6.2+</text>

      <rect x="856" y="378" width="312" height="80" rx="18" fill="#17212B"/>
      <rect x="872" y="396" width="36" height="36" rx="10" fill="#6A4DF4"/>
      <text x="922" y="411" font-weight="700" fill="#F5F5F5">Biometrics</text>
      <text x="922" y="436" font-size="14" fill="#708499">Face · Fingerprint · Token</text>
      <text x="1152" y="411" font-size="12" text-anchor="end" fill="#6AB3F3">Bot API 7.2+</text>

      <rect x="856" y="472" width="312" height="80" rx="18" fill="#17212B"/>
      <rect x="872" y="490" width="36" height="36" rx="10" fill="#E0457B"/>
      <text x="922" y="505" font-weight="700" fill="#F5F5F5">Storage</text>
      <text x="922" y="530" font-size="14" fill="#708499">Cloud · Device · Secure</text>
      <text x="1152" y="505" font-size="12" text-anchor="end" fill="#6AB3F3">Bot API 9.0+</text>

      <rect x="856" y="566" width="312" height="80" rx="18" fill="#17212B"/>
      <rect x="872" y="584" width="36" height="36" rx="10" fill="#FF9A3C"/>
      <text x="922" y="599" font-weight="700" fill="#F5F5F5">Motion sensors</text>
      <text x="922" y="624" font-size="14" fill="#708499">Gyroscope · Orientation</text>
      <text x="1152" y="599" font-size="12" text-anchor="end" fill="#6AB3F3">Bot API 8.0+</text>
    </g>

    <!-- main button -->
    <rect x="856" y="664" width="312" height="52" rx="14" fill="#5288C1"/>
    <text x="1012" y="697" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">Apply main button</text>
  </g>
</svg>
