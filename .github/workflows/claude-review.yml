name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # Secrets are not available to forks; external PRs are reviewed by the maintainer.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    outputs:
      verdict: ${{ steps.review.outputs.structured_output && fromJSON(steps.review.outputs.structured_output).verdict || 'error' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # New commits of the maintenance agent are pushed by claude[bot].
          allowed_bots: "claude[bot]"
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.base_ref }}

            Follow the instructions in `.github/claude/review.md`.
          claude_args: |
            --max-turns 80
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","changes_requested"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'
            --allowedTools "Read,Glob,Grep,LS,WebFetch,mcp__github_inline_comment__create_inline_comment,Bash(gh pr:*),Bash(gh run:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

  fix:
    name: Fix review feedback
    needs: review
    # Only PRs of the maintenance agent are fixed automatically; people fix their own PRs.
    if: needs.review.outputs.verdict == 'changes_requested' && contains(github.event.pull_request.labels.*.name, 'automated-maintenance')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    env:
      E2E_INSTALL_DEPS: "1"
      BASH_DEFAULT_TIMEOUT_MS: "1800000"
      BASH_MAX_TIMEOUT_MS: "3600000"
    steps:
      - name: Limit automatic fix rounds
        id: rounds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rounds=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json commits \
            --jq '[.commits[] | select(.messageHeadline | startswith("review-fix:"))] | length')
          echo "count=$rounds" >> "$GITHUB_OUTPUT"
          if (( rounds >= 3 )); then
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
              --body "Automatic fixing stopped after $rounds rounds. The remaining review comments need a maintainer."
          fi
      - uses: actions/checkout@v7
        if: steps.rounds.outputs.count < 3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        if: steps.rounds.outputs.count < 3
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.rounds.outputs.count < 3
      - uses: actions/setup-node@v7
        if: steps.rounds.outputs.count < 3
        with:
          node-version: "22"
      - uses: anthropics/claude-code-action@v1
        if: steps.rounds.outputs.count < 3
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # New commits of the maintenance agent are pushed by claude[bot].
          allowed_bots: "claude[bot]"
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BRANCH: ${{ github.head_ref }}

            Follow the instructions in `.github/claude/fix.md`.
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,TodoWrite,WebFetch,Bash(./gradlew:*),Bash(bash scripts/*),Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*)"

  verdict:
    name: Claude review verdict
    needs: review
    if: always() && needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Require an approving review
        run: |
          if [[ "${{ needs.review.outputs.verdict }}" != "approve" ]]; then
            echo "::error::Claude review requested changes (or did not finish). See the review comments on the PR."
            exit 1
          fi
          echo "Claude review approved this revision."
